name: Build and Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on every branch, so a bad package fails the bot's update/* pull
  # request. It builds the repository unsigned and never sees the signing key.
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Build the repository unsigned
        working-directory: package_server
        run: |
          sudo apt-get update && sudo apt-get install -y reprepro lintian
          sed -i '/^SignWith:/d' conf/distributions
          bash build-repository.sh

  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    # The environment admits main only and holds the signing key, so a run on
    # any other branch cannot read it.
    environment: repository-signing
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Build and sign the repository
        working-directory: package_server
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y reprepro lintian
          gpg --import pub.gpg
          # %b expands backslash escapes as the earlier echo -e did, in case
          # the secret stores its line breaks as \n.
          printf '%b\n' "$GPG_PRIVATE_KEY" | gpg --import --no-tty --batch --yes
          bash build-repository.sh

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: package_server
          folder: package_server
