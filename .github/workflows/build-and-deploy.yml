name: Build and Deploy

on: 
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install and Build 🔧
        run: |
          sudo apt update && sudo apt install reprepro

          cd package_server

          # import keys
          gpg2 --import pub.gpg
          echo -e "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --no-tty --batch --yes
          
          mkdir incoming

          if [ -n "$(find ../packages -type f -name '*.deb' 2>/dev/null)" ]; then
            cp ../packages/*/*/* incoming/
            reprepro -V processincoming default
          else
            echo "No packages found, skipping processincoming"
          fi

          reprepro -V export

          # Create symlink so both 'nobel' (legacy typo) and 'noble' (correct) URLs work
          ln -s nobel dists/noble

          # Generate package list JSON for main page
          bash generate-package-json.sh
          
          # Generate directory index files for browsing
          bash generate-indices.sh

      - name: Deploy 🚀
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: JamesIves/github-pages-deploy-action@4.1.3
        with:
          branch: package_server
          folder: package_server
