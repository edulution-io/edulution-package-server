name: Pull Request on update Branch Push

on:
  push:
    branches:
      - "update/**"

permissions:
  contents: read

jobs:
  auto-pull-request:
    name: PullRequestAction
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The branch name comes from whoever pushed it, so it reaches the script
      # through env, never through an expression in the script itself.
      - name: Open a pull request unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open."
            exit 0
          fi
          gh pr create --head "$BRANCH" --base main \
            --title "Update from $BRANCH" \
            --body "This is an automated pull request to update from branch $BRANCH"
