name: Pull Request on update Branch Push

on:
  push:
    branches-ignore:
      - main
      - package_server

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pull-request:
    name: PullRequestAction
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: pull-request-action
        uses: vsoch/pull-request-action@77b3eea5c721545c56f775e1ed4ff9c9c1386148 # master, 2025-04-23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_PREFIX: "update/"
          PULL_REQUEST_BRANCH: "main"
